<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Smudge Machine</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@500;800&display=swap">
<style>
/* Layout concept: a handheld sampler. OLED and transport stay pinned on top, one panel swaps underneath (launch / blend / fx), tab keys sit on the bottom edge. */
:root{
  --chassis:#d4d6dd; --chassis-lo:#c2c5cf; --pad:#eef0f4; --pad-edge:#adb1bf; --hi:rgba(255,255,255,.55);
  --ink:#16171e; --ink-2:#555969; --line:#aeb2bf;
  --screen:#100e1d; --screen-ink:#cabdff; --screen-mute:#6f66a6; --screen-dim:#2b2547; --screen-hot:#ffb347; --screen-line:#3a335c;
  --signal:#ff4a1c; --on-lit:#16171e; --go:#2fcf78;
  --c-drums:#ff6a3a; --c-bass:#9a85ff; --c-keys:#ffb81f; --c-chop:#19c5b5; --c-lead:#ff5fa2; --c-tex:#5b9bff;
  --g0:rgba(255,184,31,.55); --g1:rgba(255,95,162,.55); --g2:rgba(25,197,181,.55); --g3:rgba(154,133,255,.6);
  --f-display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --f-label:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  --f-dot:'Doto','DM Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --chassis:#1c1d24; --chassis-lo:#14151b; --pad:#2c2d38; --pad-edge:#0b0b0f; --hi:rgba(255,255,255,.07);
    --ink:#eceef4; --ink-2:#9ca0b2; --line:#3b3d4a; --signal:#ff5a2e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --chassis:#1c1d24; --chassis-lo:#14151b; --pad:#2c2d38; --pad-edge:#0b0b0f; --hi:rgba(255,255,255,.07);
  --ink:#eceef4; --ink-2:#9ca0b2; --line:#3b3d4a; --signal:#ff5a2e; color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--chassis);color:var(--ink);font-family:var(--f-label);-webkit-font-smoothing:antialiased;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
#app{--padh:54px;--scoph:28px;--xyh:300px;height:100%;max-width:460px;margin:0 auto;padding-inline:16px;padding-block:6px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px}

@supports (height:100dvh){#app{--padh:clamp(42px,calc((100dvh - 296px) / 6 - 8px),56px);--xyh:clamp(200px,calc(100dvh - 400px),340px)}}
/* header */
.top{display:flex;justify-content:space-between;align-items:center}
.wm{font:900 18px/1 var(--f-display);font-stretch:125%;letter-spacing:-.025em}
.model{display:block;margin-top:3px;font:500 8.5px var(--f-label);letter-spacing:.16em;color:var(--ink-2)}
.stat{display:flex;align-items:center;gap:8px;font:500 10px var(--f-label);letter-spacing:.12em;color:var(--ink-2);font-variant-numeric:tabular-nums}
.led{width:8px;height:8px;border-radius:50%;background:var(--line);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.led[data-s="dig"]{background:var(--screen-hot);animation:blink .7s steps(2) infinite}
.led[data-s="play"]{background:var(--go);box-shadow:0 0 8px var(--go)}
@keyframes blink{50%{opacity:.25}}

/* oled */
.screen{background:var(--screen);border-radius:14px;padding:8px 12px;box-shadow:inset 0 0 0 1px var(--screen-line),0 1px 0 var(--hi);color:var(--screen-ink)}
.s-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bpm{display:flex;align-items:flex-end;gap:6px;min-width:0}
.bpm b{font:800 30px/.9 var(--f-dot);letter-spacing:.02em;font-variant-numeric:tabular-nums;min-width:3.4ch}
.bpm small{font:500 8px var(--f-label);letter-spacing:.16em;color:var(--screen-mute);padding-bottom:1px}
.info{text-align:right;min-width:0}
.key{font:500 9.5px var(--f-label);letter-spacing:.14em;color:var(--screen-hot);white-space:nowrap}
.chips{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap;margin-top:3px}
.chips span{font:500 9px var(--f-label);padding:2px 4px;border-radius:5px;color:var(--screen-mute);box-shadow:inset 0 0 0 1px var(--screen-dim)}
.chips span.cur{color:var(--screen);background:var(--screen-ink);box-shadow:none}
#scope{display:block;width:100%;height:var(--scoph);margin-top:6px}
.s-bot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.beats{display:flex;gap:4px}
.beats i{width:13px;height:5px;border-radius:2px;background:var(--screen-dim)}
.beats i:nth-child(5){margin-left:6px}
.beats i.cur{background:var(--screen-hot)}
.pips{display:flex;gap:3px}
.pips i{width:4px;height:8px;border-radius:1px;background:var(--screen-dim)}
.pips i.lit{background:var(--c)}
.pips i:nth-child(4n+1):not(:first-child){margin-left:5px}

/* keys */
.transport{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:8px}
.key-btn{height:40px;border:0;border-radius:12px;background:var(--pad);box-shadow:0 2px 0 var(--pad-edge),inset 0 1px 0 var(--hi);font:500 11px var(--f-label);letter-spacing:.14em;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .05s}
.key-btn:active{transform:translateY(2px);box-shadow:0 0 0 var(--pad-edge)}
.key-btn[disabled]{opacity:.5}
.key-btn.go{background:var(--signal);color:var(--on-lit);font-weight:500}
.key-btn svg{width:12px;height:12px;fill:currentColor}
#quant{flex-direction:column;gap:3px}
#quant small{font:500 7.5px/1 var(--f-label);letter-spacing:.14em;color:var(--ink-2)}

/* panel */
#panel{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-top:2px}
#panel::-webkit-scrollbar{display:none}
.lane{display:grid;grid-template-columns:58px 1fr 24px;gap:8px;margin-bottom:8px}
.lname{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;min-width:0}
.lname span{font:500 10px var(--f-label);letter-spacing:.1em;display:flex;align-items:center;gap:5px}
.lname span::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--c)}
.regen{width:30px;height:24px;border:0;border-radius:8px;background:var(--chassis-lo);color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.regen svg{width:13px;height:13px}
.regen:active{background:var(--c);color:var(--on-lit)}
.regen[disabled]{opacity:.4}
.pads{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.pad{position:relative;height:var(--padh);border:0;border-radius:10px;background:var(--pad);color:var(--ink);box-shadow:0 2px 0 var(--pad-edge),inset 0 1px 0 var(--hi);padding:0;overflow:hidden;text-align:left;touch-action:manipulation}
.pad::before{content:"";position:absolute;inset:0;background:var(--c);opacity:var(--lvl,0)}
.pad .nm{position:absolute;left:5px;top:6px;z-index:2;font:500 8px var(--f-label);letter-spacing:.03em}
.pad .dot{position:absolute;right:6px;top:6px;z-index:2;width:5px;height:5px;border-radius:50%;background:var(--line)}
.pad svg{position:absolute;left:4px;right:4px;bottom:5px;width:calc(100% - 8px);height:calc(var(--padh) - 26px);fill:currentColor;opacity:.42;z-index:1}
.pad.on{color:var(--on-lit)}
.pad.on .dot{background:var(--on-lit)}
.pad.on svg{opacity:.62}
.pad.q .dot{animation:blink .35s steps(2) infinite;background:var(--signal)}
.pad.nr{opacity:.4;pointer-events:none}
.pad:active{transform:translateY(2px);box-shadow:0 0 0 var(--pad-edge)}
.fader{position:relative;border-radius:8px;background:var(--chassis-lo);touch-action:none;box-shadow:inset 0 1px 2px rgba(0,0,0,.28)}
.fader i{position:absolute;left:3px;right:3px;bottom:3px;height:max(4px,calc((100% - 6px) * var(--v)));border-radius:5px;background:var(--c)}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{height:40px;border:0;border-radius:12px;background:var(--chassis-lo);color:var(--ink-2);font:500 10px var(--f-label);letter-spacing:.16em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.tab i{width:14px;height:3px;border-radius:2px;background:var(--line)}
.tab[aria-selected="true"]{color:var(--ink);background:var(--pad);box-shadow:0 2px 0 var(--pad-edge),inset 0 1px 0 var(--hi)}
.tab[aria-selected="true"] i{background:var(--signal);box-shadow:0 0 6px var(--signal)}

/* blend */
.xywrap{width:100%;display:flex;flex-direction:column;gap:10px}
.xy{position:relative;height:var(--xyh);width:100%;border-radius:16px;background-color:var(--screen);background-image:radial-gradient(circle,var(--screen-dim) 1.2px,transparent 1.7px);background-size:22px 22px;background-position:11px 11px;box-shadow:inset 0 0 0 1px var(--screen-line);touch-action:none;overflow:hidden}
.glow{position:absolute;inset:0;opacity:0;pointer-events:none}
.glow[data-s="0"]{background:radial-gradient(circle at 0 0,var(--g0),transparent 72%)}
.glow[data-s="1"]{background:radial-gradient(circle at 100% 0,var(--g1),transparent 72%)}
.glow[data-s="2"]{background:radial-gradient(circle at 0 100%,var(--g2),transparent 72%)}
.glow[data-s="3"]{background:radial-gradient(circle at 100% 100%,var(--g3),transparent 72%)}
.cell{position:absolute;z-index:3;width:92px;padding:7px 8px 8px;border:0;border-radius:10px;background:var(--screen);box-shadow:inset 0 0 0 1px var(--screen-line);color:var(--screen-ink);text-align:left;touch-action:manipulation}
.cell[data-s="0"]{left:8px;top:8px}.cell[data-s="1"]{right:8px;top:8px}.cell[data-s="2"]{left:8px;bottom:8px}.cell[data-s="3"]{right:8px;bottom:8px}
.cell b{display:block;font:800 18px/1 var(--f-dot)}
.cell small{display:block;margin-top:3px;font:500 8.5px var(--f-label);letter-spacing:.12em;color:var(--screen-mute)}
.cell .dots{display:flex;gap:3px;margin-top:7px}
.cell .dots i{width:9px;height:5px;border-radius:1px;background:var(--screen-dim)}
.cell .dots i.lit{background:var(--c)}
.xy.armed .cell{box-shadow:inset 0 0 0 1.5px var(--signal)}
.puck{position:absolute;z-index:4;left:calc(var(--x) * 100%);top:calc(var(--y) * 100%);width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:3px solid var(--screen-mute);background:rgba(16,14,29,.55);pointer-events:none}
.puck::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--screen-mute)}
.xy.live .puck{border-color:var(--signal)}
.xy.live .puck::after{background:var(--signal)}
.blend-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.key-btn.arm[aria-pressed="true"]{background:var(--signal);color:var(--on-lit)}
.hint{margin:0;font:400 10px/1.5 var(--f-label);letter-spacing:.03em;color:var(--ink-2);min-height:3em}

/* fx */
.knobs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 8px;padding-top:6px}
.knob{display:flex;flex-direction:column;align-items:center;gap:4px;touch-action:none;outline-offset:4px}
.knob svg{width:min(100%,92px);height:auto;display:block}
.knob .cap{fill:var(--pad);stroke:var(--pad-edge);stroke-width:2}
.knob .track{fill:none;stroke:var(--line);stroke-width:4;stroke-linecap:round}
.knob .val{fill:none;stroke:var(--signal);stroke-width:4;stroke-linecap:round}
.knob .ptr{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.knob .nm{font:500 10px var(--f-label);letter-spacing:.14em}
.knob output{font:500 10px var(--f-label);color:var(--ink-2);letter-spacing:.06em;min-height:1.2em;font-variant-numeric:tabular-nums}
.fx-note{margin:18px 0 0;font:400 10px/1.5 var(--f-label);color:var(--ink-2);letter-spacing:.04em;text-align:center}

/* power */
.power{position:fixed;inset:0;z-index:20;background:var(--chassis);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px;text-align:center}
.power .wm{font-size:42px}
.power p{margin:0;max-width:30ch;font:400 11px/1.6 var(--f-label);color:var(--ink-2);letter-spacing:.04em}
.pwr{width:92px;height:92px;border-radius:50%;border:0;background:var(--pad);box-shadow:0 4px 0 var(--pad-edge),inset 0 1px 0 var(--hi);display:flex;align-items:center;justify-content:center;color:var(--signal)}
.pwr:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pad-edge)}
.pwr svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.power small{font:500 9px var(--f-label);letter-spacing:.18em;color:var(--ink-2)}

@media (prefers-reduced-motion: reduce){.led,.pad.q .dot{animation:none}}

</style>

<div id="app">
  <header class="top">
    <div><div class="wm">SMUDGE</div><span class="model">SM-30 · LOOP SAMPLER</span></div>
    <div class="stat"><i class="led" id="led" data-s="idle"></i><span id="stat">STANDBY</span></div>
  </header>

  <section class="screen" aria-label="Display">
    <div class="s-top">
      <div class="bpm"><b id="bpm">---</b><small>BPM</small></div>
      <div class="info"><div class="key" id="key">NO CRATE</div><div class="chips" id="chips"></div></div>
    </div>
    <canvas id="scope" aria-hidden="true"></canvas>
    <div class="s-bot"><div class="beats" id="beats"></div></div>
  </section>

  <div class="transport">
    <button class="key-btn go" id="play" aria-label="Play or stop"><svg viewBox="0 0 12 12" id="playico"><path d="M2 1l9 5-9 5z"/></svg><span id="playtxt">PLAY</span></button>
    <button class="key-btn" id="dig" aria-label="Dig a new crate of loops">DIG</button>
    <button class="key-btn" id="quant" aria-label="Change loops on bar, beat or immediately"><small>CHANGE ON</small><span id="qv">BAR</span></button>
  </div>

  <main id="panel">
    <section id="v-launch"><div id="lanes"></div></section>
    <section id="v-blend" hidden>
      <div class="xywrap">
        <div class="xy" id="xy" aria-label="Scene blend pad">
          <div class="glow" data-s="0"></div><div class="glow" data-s="1"></div><div class="glow" data-s="2"></div><div class="glow" data-s="3"></div>
          <div id="cells"></div>
          <div class="puck" id="puck" style="--x:.5;--y:.5"></div>
        </div>
        <div class="blend-row">
          <button class="key-btn arm" id="store" aria-pressed="false">STORE</button>
          <button class="key-btn" id="shuffle">SHUFFLE</button>
        </div>
        <p class="hint" id="hint"></p>
      </div>
    </section>
    <section id="v-fx" hidden>
      <div class="knobs" id="knobs"></div>
      <p class="fx-note">Drag a knob up or down. Double-tap to reset.</p>
    </section>
  </main>

  <nav class="tabs" role="tablist" aria-label="Panels">
    <button class="tab" role="tab" data-t="launch" aria-selected="true"><span>LAUNCH</span><i></i></button>
    <button class="tab" role="tab" data-t="blend" aria-selected="false"><span>BLEND</span><i></i></button>
    <button class="tab" role="tab" data-t="fx" aria-selected="false"><span>FX</span><i></i></button>
  </nav>
</div>

<div class="power" id="power">
  <div class="wm">SMUDGE</div>
  <p>Dig a crate of dusty, sample-style loops. Launch them, stack them, blend scenes. Dark, dreamy, a little dirty.</p>
  <button class="pwr" id="pwr" aria-label="Power on"><svg viewBox="0 0 34 34"><path d="M17 4v12"/><path d="M9 9a11 11 0 1 0 16 0"/></svg></button>
  <small>TAP TO POWER ON · HEADPHONES RECOMMENDED</small>
</div>

<script>
/* SMUDGE engine: procedural, sample-flavoured loop generator (pure JS DSP, no DOM) */
(function (root) {
'use strict';
const TAU = Math.PI * 2;
const NOTE = ['C', 'D♭', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function rng32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const pick = (r, a) => a[Math.floor(r() * a.length)];
const rnd = (r, a, b) => a + (b - a) * r();
const noise = r => r() * 2 - 1;
function sat(x) { if (x > 3) x = 3; else if (x < -3) x = -3; return x * (27 + x * x) / (27 + 9 * x * x); }
function polyblep(t, dt) {
  if (t < dt) { t /= dt; return t + t - t * t - 1; }
  if (t > 1 - dt) { t = (t - 1) / dt; return t * t + t + t + 1; }
  return 0;
}
function peakOf(x) { let p = 0; for (let i = 0; i < x.length; i++) { const a = Math.abs(x[i]); if (a > p) p = a; } return p; }
function rmsOf(x) { let s = 0; for (let i = 0; i < x.length; i++) s += x[i] * x[i]; return Math.sqrt(s / x.length); }
function rdc(x, j, n) { j = ((j % n) + n) % n; const i0 = Math.floor(j), f = j - i0, i1 = i0 + 1 >= n ? 0 : i0 + 1; return x[i0] * (1 - f) + x[i1] * f; }
function lfoHz(rate, n, sr) { return Math.max(1, Math.round(rate * n / sr)) * sr / n; }

/* ---------- filters / fx ---------- */
class SVF {
  constructor(sr) { this.sr = sr; this.ic1 = 0; this.ic2 = 0; this.a1 = 0; this.a2 = 0; this.a3 = 0; this.k = 1; this.lo = 0; this.bd = 0; this.hi = 0; this.set(1000, 0.7); }
  set(fc, q) {
    fc = Math.min(Math.max(fc, 10), this.sr * 0.46);
    const g = Math.tan(Math.PI * fc / this.sr), k = 1 / q;
    this.k = k; this.a1 = 1 / (1 + g * (g + k)); this.a2 = g * this.a1; this.a3 = g * this.a2;
  }
  tick(v0) {
    const v3 = v0 - this.ic2, v1 = this.a1 * this.ic1 + this.a2 * v3, v2 = this.ic2 + this.a2 * this.ic1 + this.a3 * v3;
    this.ic1 = 2 * v1 - this.ic1; this.ic2 = 2 * v2 - this.ic2;
    this.lo = v2; this.bd = v1; this.hi = v0 - this.k * v1 - v2;
    return v2;
  }
}
function filterBuf(x, sr, type, fc, q) {
  const f = new SVF(sr); f.set(fc, q || 0.7); const n = x.length;
  for (let i = Math.max(0, n - Math.floor(sr * 0.6)); i < n; i++) f.tick(x[i]);
  if (type === 'lp') for (let i = 0; i < n; i++) { f.tick(x[i]); x[i] = f.lo; }
  else if (type === 'hp') for (let i = 0; i < n; i++) { f.tick(x[i]); x[i] = f.hi; }
  else for (let i = 0; i < n; i++) { f.tick(x[i]); x[i] = f.k * f.bd; }
}
function crush(x, sr, rate, bits) {
  const q = Math.pow(2, bits - 1), step = sr / rate; let acc = step, hold = 0;
  for (let i = 0; i < x.length; i++) { acc += 1; if (acc >= step) { acc -= step; hold = Math.round(x[i] * q) / q; } x[i] = hold; }
}
function addWrap(buf, start, src, gain) {
  const n = buf.length; start = ((Math.round(start) % n) + n) % n;
  for (let i = 0; i < src.length; i++) { let j = start + i; if (j >= n) j %= n; buf[j] += src[i] * gain; }
}
function fadeIO(o, fi, fo) {
  const n = o.length;
  for (let i = 0; i < fi && i < n; i++) o[i] *= i / fi;
  for (let i = 0; i < fo && i < n; i++) o[n - 1 - i] *= i / fo;

function normPeak(o, p) { const m = peakOf(o); if (m > 0) { const g = p / m; for (let i = 0; i < o.length; i++) o[i] *= g; } }
function reverbBake(L, R, sr, mix, size, damp) {
  if (mix <= 0) return;
  const n = L.length, sc = sr / 44100;
  const cd = [1116, 1188, 1277, 1356, 1422, 1491].map(d => Math.round(d * sc));

function polar(r, deg) { const a = deg * Math.PI / 180; return [50 + r * Math.sin(a), 50 - r * Math.cos(a)]; }

  const [x0, y0] = polar(r, a0), [x1, y1] = polar(r, a1);
  return 'M' + x0.toFixed(2) + ' ' + y0.toFixed(2) + 'A' + r + ' ' + r + ' 0 ' + (Math.abs(a1 - a0) > 180 ? 1 : 0) + ' ' + (a1 > a0 ? 1 : 0) + ' ' + x1.toFixed(2) + ' ' + y1.toFixed(2);
}
function drawKnob(K) {
  const el = $('.knob[data-k="' + K.k + '"]'), v = S.fx[K.k], t = (v - K.min) / (K.max - K.min), ang = -135 + 270 * t, bip = K.min < 0;
  $('.val', el).setAttribute('d', arc(40, bip ? 0 : -135, ang));
  const [x0, y0] = polar(12, ang), [x1, y1] = polar(30, ang), p = $('.ptr', el);
  p.setAttribute('x1', x0); p.setAttribute('y1', y0); p.setAttribute('x2', x1); p.setAttribute('y2', y1);
  $('output', el).textContent = K.fmt(v); el.setAttribute('aria-valuenow', v.toFixed(2));
}
(function () {
  const host = $('#knobs');
  KNOBS.forEach(K => {
    const d = document.createElement('div'); d.className = 'knob'; d.dataset.k = K.k; d.setAttribute('role', 'slider'); d.tabIndex = 0;
    d.setAttribute('aria-label', K.name.toLowerCase()); d.setAttribute('aria-valuemin', K.min); d.setAttribute('aria-valuemax', K.max);
    d.innerHTML = '<svg viewBox="0 0 100 100"><path class="track" d="' + arc(40, -135, 135) + '"/><path class="val"/><circle class="cap" cx="50" cy="50" r="31"/><line class="ptr"/></svg><span class="nm">' + K.name + '</span><output></output>';
    host.appendChild(d);
    let sy = 0, sv = 0, last = 0;
    const setV = v => { v = clamp(v, K.min, K.max); if (K.min < 0 && Math.abs(v) < 0.04) v = 0; S.fx[K.k] = v; applyFx(K.k); drawKnob(K); };
    d.addEventListener('pointerdown', e => {
      d.setPointerCapture(e.pointerId); const now = performance.now();
      if (now - last < 320) { setV(K.def); last = 0; sy = e.clientY; sv = S.fx[K.k]; return; } last = now; sy = e.clientY; sv = S.fx[K.k];
    });
    d.addEventListener('pointermove', e => { if (d.hasPointerCapture(e.pointerId)) setV(sv + (sy - e.clientY) / 160 * (K.max - K.min)); });
    d.addEventListener('keydown', e => {
      const st = (K.max - K.min) / 20;
      if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { setV(S.fx[K.k] + st); e.preventDefault(); }
      if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { setV(S.fx[K.k] - st); e.preventDefault(); }
    });
    drawKnob(K);
  });
})();

/* ---------------- tabs, buttons ---------------- */
function setTab(t) {
  S.tab = t;
  $$('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.t === t));
  $('#v-launch').hidden = t !== 'launch'; $('#v-blend').hidden = t !== 'blend'; $('#v-fx').hidden = t !== 'fx';
}
$$('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.t)));
$('#play').addEventListener('click', () => { if (!S.ctx) return; if (S.playing) stop(); else play(); });
$('#dig').addEventListener('click', () => { if (S.ctx) dig(false); });
$('#quant').addEventListener('click', () => { S.quant = (S.quant + 1) % 3; $('#qv').textContent = ['BAR', 'BEAT', 'NOW'][S.quant]; });
$('#pwr').addEventListener('click', async () => {
  if (S.powered) return; S.powered = true;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) { $('#power').querySelector('p').textContent = 'This browser has no Web Audio support.'; S.powered = false; return; }
  const ctx = new AC({ latencyHint: 'interactive' }); S.ctx = ctx; S.sr = ctx.sampleRate;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { }
  try { const a = new Audio(silentWav()); a.loop = true; const pr = a.play(); if (pr && pr.catch) pr.catch(() => { }); S.keep = a; } catch (e) { }
  try { const b = ctx.createBuffer(1, 1, S.sr), s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(0); } catch (e) { }
  buildGraph();
  try { await ctx.resume(); } catch (e) { }
  $('#power').hidden = true; dig(true);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.ctx && S.ctx.state !== 'running') S.ctx.resume().catch(() => { }); });
document.addEventListener('pointerdown', () => { if (S.ctx && S.ctx.state === 'suspended') S.ctx.resume().catch(() => { }); }, true);

/* ---------------- display ---------------- */
const scope = $('#scope'), sc = scope.getContext('2d');
let SW = 0, SH = 0, dpr = 1;
const COLS = 32, ROWS = 9, peaks = new Float32Array(COLS), fft = new Uint8Array(512);
const CS = getComputedStyle(document.documentElement);
const colInk = CS.getPropertyValue('--screen-ink').trim() || '#cabdff', colDim = CS.getPropertyValue('--screen-dim').trim() || '#2b2547', colHot = CS.getPropertyValue('--screen-hot').trim() || '#ffb347';
function sizeScope() { const r = scope.getBoundingClientRect(); dpr = Math.min(2, window.devicePixelRatio || 1); SW = r.width; SH = r.height; scope.width = Math.max(1, Math.round(SW * dpr)); scope.height = Math.max(1, Math.round(SH * dpr)); }
if (window.ResizeObserver) new ResizeObserver(sizeScope).observe(scope); else window.addEventListener('resize', sizeScope);
sizeScope();
function drawScope(live) {
  sc.setTransform(dpr, 0, 0, dpr, 0, 0); sc.clearRect(0, 0, SW, SH);
  const cw = SW / COLS, rh = SH / ROWS, rad = Math.max(1, Math.min(cw, rh) * 0.3);
  if (live) {
    N.an.getByteFrequencyData(fft);
    const nyq = S.sr / 2, bins = fft.length;
    for (let c = 0; c < COLS; c++) {
      const f0 = 40 * Math.pow(14000 / 40, c / COLS), f1 = 40 * Math.pow(14000 / 40, (c + 1) / COLS);
      const b0 = Math.floor(f0 / nyq * bins), b1 = Math.max(b0 + 1, Math.ceil(f1 / nyq * bins)); let m = 0;
      for (let b = b0; b < b1 && b < bins; b++) if (fft[b] > m) m = fft[b];
      const lv = Math.pow(m / 255, 1.5) * ROWS; peaks[c] = Math.max(lv, peaks[c] - 0.12);
      for (let r = 0; r < ROWS; r++) {
        const lit = r < lv, pk = Math.abs(r - Math.floor(peaks[c])) < 1 && peaks[c] > 0.5;
        sc.fillStyle = pk ? colHot : lit ? colInk : colDim;
        sc.beginPath(); sc.arc(c * cw + cw / 2, SH - (r * rh + rh / 2), rad, 0, 6.2832); sc.fill();
      }
    }
  } else {
    sc.fillStyle = colDim;
    for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) { sc.beginPath(); sc.arc(c * cw + cw / 2, SH - (r * rh + rh / 2), rad, 0, 6.2832); sc.fill(); }
  }
}
let lastRate = 0, lastMorph = 0, lastBeat = -1, lastBpm = '';
function frame(ts) {
  requestAnimationFrame(frame);
  if (!S.ctx || !N) { drawScope(false); return; }
  if (ts - lastRate > 30 && Math.abs(S.rateT - S.rate) > 1e-5) {
    lastRate = ts; S.rate += (S.rateT - S.rate) * 0.4; if (Math.abs(S.rateT - S.rate) < 2e-4) S.rate = S.rateT; setRate(S.rate);
    if (S.crate) { const t = (S.crate.bpm * S.rate).toFixed(1); if (t !== lastBpm) { lastBpm = t; $('#bpm').textContent = t; } }
  }
  if (S.dirty && S.mode === 'morph' && ts - lastMorph > 30) { lastMorph = ts; S.dirty = false; syncLevels(0, true); }
  if (S.playing && S.crate) {
    const beat = posAt(S.ctx.currentTime) / S.crate.spb, bi = clamp(Math.floor(beat), 0, 7);
    if (bi !== lastBeat) {
      lastBeat = bi; $$('i', beatsEl).forEach((el, i) => el.classList.toggle('cur', i === bi));
      let ci = 0; S.crate.chords.forEach((ch, i) => { if (beat >= ch.start) ci = i; });
      if (ci !== S.chipCur) { S.chipCur = ci; $$('#chips span').forEach((el, i) => el.classList.toggle('cur', i === ci)); }
    }
    drawScope(true);
  } else { if (lastBeat !== -1) { lastBeat = -1; $$('i', beatsEl).forEach(el => el.classList.remove('cur')); $$('#chips span').forEach(el => el.classList.remove('cur')); S.chipCur = -1; } drawScope(false); }
}
requestAnimationFrame(frame);
setTab('launch'); paintTransport(); setStatus(); renderCells();
})();
</script>
